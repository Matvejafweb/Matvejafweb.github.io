    <script>
    // Создание снежинок
    function createSnowflake() {
        const snowflake = document.createElement('div');
        snowflake.classList.add('snowflake');
        snowflake.textContent = '❅'; // Символ снежинки
        snowflake.style.left = Math.random() * 100 + 'vw'; // Случайное положение по горизонтали
        snowflake.style.opacity = Math.random(); // Случайная прозрачность
        snowflake.style.fontSize = (Math.random() * 1.5 + 0.5) + 'em'; // Случайный размер

        // Длительность падения
        const animationDuration = Math.random() * 5 + 5;
        snowflake.style.animationDuration = animationDuration + 's';

        document.body.appendChild(snowflake);

        // Удаляем снежинку после завершения анимации
        setTimeout(() => {
            snowflake.remove();
        }, animationDuration * 1000);
    }

    // Генерация снежинок каждые 300–700 мс
    setInterval(createSnowflake, Math.random() * 300 + 200);
</script>
